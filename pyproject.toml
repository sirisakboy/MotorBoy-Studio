[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hondaecu"
version = "1.0.0"
description = "A diagnostic and flashing tool for Honda ECUs"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "MCU Innovations Inc", email = "info@mcuinnovations.com"}
]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Automotive",
    "Topic :: Software Development :: Embedded Systems",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyusb",
    "pydispatcher",
    "wxPython",
    "requests",
    "lxml",
    "numpy>=1.20",
    "colour",
    "pyparsing",
    "gitpython",
    "appdirs",
]

[project.optional-dependencies]
dev = [
    "pyinstaller",
]

[project.urls]
Homepage = "https://github.com/RyanHope/HondaECU"
Repository = "https://github.com/RyanHope/HondaECU"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"" = ["images/*.png", "images/*.ico"]